name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # A throwaway database owned by this job: CI needs no real credentials.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/tat_ci
      JWT_SECRET_KEY: ci-only-secret-key-that-signs-nothing-real
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app
      - name: Prepare the database
        # Supabase ships an "extensions" schema that plain PostgreSQL lacks and
        # the search-index migration installs pg_trgm into it.
        run: |
          psql "postgresql://postgres:ci-only-password@localhost:5432/tat_ci" -c "CREATE SCHEMA extensions"
          alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Tests
        run: |
          printenv | grep -E '^(ENVIRONMENT|DATABASE_URL|JWT_SECRET_KEY|COOKIE_SECURE)=' > .env.test
          pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Build
        run: npm run build
