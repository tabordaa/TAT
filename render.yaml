services:
  - type: web
    name: tat-api
    runtime: python
    plan: free
    # Same region as the production Supabase project (us-east-1). Every query is a
    # round trip to the database: across regions that adds ~70 ms to each one.
    # Render cannot move an existing service; a new region means a new service.
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server starts: if one fails, the old version
    # keeps serving. --no-proxy-headers because app.core.network resolves the
    # client IP itself, counting only the proxies we trust.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /health
    # Deploy a commit on main only after its GitHub checks (backend, frontend,
    # e2e) pass, so a red build never reaches production.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      # Values below are entered in the Render dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
